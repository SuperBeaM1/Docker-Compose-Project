# nginx.conf
# ----------
# ตั้งค่า nginx ให้ทำ 2 หน้าที่ในเซิร์ฟเวอร์เดียว:
#   1. เสิร์ฟไฟล์ static (index.html) เป็นหน้าเว็บหลัก
#   2. proxy request ที่ขึ้นต้นด้วย /api/ ไปยัง backend container
#      (ใช้ชื่อ service "backend" ตามที่กำหนดใน docker-compose.yml
#      Docker Compose สร้าง internal DNS ให้เรียกชื่อ service แทน IP ได้เลย)

server {
    # nginx listen ที่ port 80 ภายใน container
    listen 80;

    # โฟลเดอร์ที่เก็บไฟล์ static ที่ copy เข้ามาตอน build image
    root /usr/share/nginx/html;
    index index.html;

    # request หน้าเว็บทั่วไป -> เสิร์ฟไฟล์ static ตรง ๆ
    location / {
        try_files $uri $uri/ /index.html;
    }

    # request ที่ path ขึ้นต้นด้วย /api/ -> ตัด /api ออก แล้วส่งต่อไปยัง
    # backend container ที่ port 8000 (ชื่อ "backend" คือชื่อ service
    # ใน docker-compose.yml ไม่ใช่ localhost)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
